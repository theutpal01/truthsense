version: '3.8'

services:
  # Redis service for background job processing
  redis:
    image: redis:7-alpine
    container_name: truthsense-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - truthsense-network

  # Main backend application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truthsense-backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8002}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - OTP_RATE_LIMIT_WINDOW=${OTP_RATE_LIMIT_WINDOW:-15}
      - OTP_RATE_LIMIT_MAX=${OTP_RATE_LIMIT_MAX:-5}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-50MB}
      - ALLOWED_AUDIO_TYPES=${ALLOWED_AUDIO_TYPES:-audio/wav,audio/webm,audio/mp3,audio/m4a}
      - AI_PROCESSING_TIMEOUT=${AI_PROCESSING_TIMEOUT:-300000}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-https://57095d3b5a3c.ngrok-free.app}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - truthsense-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
    driver: local

networks:
  truthsense-network:
    driver: bridge
    name: truthsense-network
